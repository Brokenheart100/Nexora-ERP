name: P1 foundation
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-dotnet@v6.1.0
        with:
          global-json-file: global.json
      - run: dotnet tool restore
      - run: dotnet restore Nexora.slnx --locked-mode
      - run: dotnet build Nexora.slnx -c Release --no-restore --verbosity minimal
      - run: dotnet test tests/Nexora.Tests -c Release --no-build --logger "trx;LogFileName=p1-slice.trx" --results-directory artifacts/p1/test-results
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: p1-test-results
          path: artifacts/p1/test-results/*.trx
          if-no-files-found: warn
